<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: YouTube Red into Deep Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A4B"/>
      <stop offset="50%" stop-color="#E60026"/>
      <stop offset="100%" stop-color="#7C00A3"/>
    </linearGradient>

    <!-- Shield Gloss Gradient -->
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Inner Glow & Accent -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="squircleShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="symbolShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" filter="url(#squircleShadow)"/>

  <!-- Subtle Top Highlight Rim -->
  <rect x="7" y="7" width="114" height="57" rx="27" fill="#FFFFFF" opacity="0.08"/>

  <!-- Outer Shield Contour (Security / Verification) -->
  <path d="M64 22 
           C78 22, 91 26, 94 30 
           C94 56, 83 82, 64 98 
           C45 82, 34 56, 34 30 
           C37 26, 50 22, 64 22 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.12" 
        stroke="url(#shieldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#symbolShadow)"/>

  <!-- Play Symbol Contour Inside Shield (YouTube DNA) -->
  <path d="M52 44 
           L74 58 
           L52 72 Z" 
        fill="#FFFFFF" 
        opacity="0.95"/>

  <!-- Glowing Fact-Check Verification Mark on Shield Lower Right -->
  <circle cx="82" cy="78" r="17" fill="#0F172A" stroke="#FFFFFF" stroke-width="3.5" filter="url(#symbolShadow)"/>
  <circle cx="82" cy="78" r="14" fill="url(#checkGrad)"/>
  
  <!-- Checkmark Path -->
  <path d="M76 78.5 L80 82.5 L89 73.5" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
